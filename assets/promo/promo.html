<!-- Sirah Mute 1:1 promo carousel. Render: chrome --headless --window-size=1080,1080 file:///promo.html#<slide>-<lang>  (slide 1..3, lang en|id) -->
<style>
:root{--red:#E5484D;--ink:#0E0F12;--fg:#ECEDEF;--mute:#9AA0AA}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1080px;overflow:hidden}
body{background:radial-gradient(800px 600px at 50% 55%,#2a1416 0%,transparent 70%),var(--ink);
 font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;color:var(--fg);padding:76px 72px 64px;display:flex;flex-direction:column}
.s{display:none;flex:1;flex-direction:column;justify-content:center;gap:44px;padding-bottom:70px}
.s.on{display:flex}
h2{font-size:66px;font-weight:700;letter-spacing:-1.6px;line-height:1.06}
h2 b{color:var(--red)}
.brand{position:absolute;left:72px;right:72px;bottom:60px;display:flex;align-items:center;gap:16px;font-size:30px;font-weight:700}
.brand svg{width:46px;height:46px}
.brand .r{margin-left:auto;font-size:24px;font-weight:600;color:var(--mute)}
.screen{position:relative;width:936px;height:500px;border-radius:16px;overflow:hidden;
 background:linear-gradient(180deg,#1d2a44 0%,#3b3156 45%,#7a4a52 75%,#2b1d22 100%);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.screen svg.scene{position:absolute;inset:0;width:100%;height:100%}
.glow{position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 6px var(--red),inset 0 0 38px 12px rgba(229,72,77,.65),inset 0 0 100px 22px rgba(229,72,77,.25)}
.live{position:absolute;left:30px;top:28px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);padding:7px 13px;border-radius:6px;font-size:17px;font-weight:700;letter-spacing:1px}
.live i{width:10px;height:10px;border-radius:50%;background:#ff3b3b}
.pill{position:absolute;right:32px;top:26px;display:flex;align-items:center;gap:12px;height:54px;padding:0 22px;border-radius:27px;
 background:rgba(18,10,11,.92);border:1.8px solid rgba(229,72,77,.85);font-size:22px}
.pill .ic{font-family:"Segoe Fluent Icons","Segoe MDL2 Assets";color:var(--red);font-size:22px}
.pill .lb{font-weight:600}.pill .ck{color:#D7DADF;font-variant-numeric:tabular-nums;margin-left:4px}
.bub{position:absolute;right:32px;bottom:76px;width:330px;display:flex;flex-direction:column;gap:9px}
.bub div{background:rgba(0,0,0,.5);border-radius:9px;padding:9px 14px;font-size:18px;color:#e6e7ea}
.bub b{color:#9ad1ff;font-weight:600}
.bar{position:absolute;left:0;right:0;bottom:0;height:52px;background:rgba(12,13,16,.86);display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 24px}
.bar .dot{width:18px;height:18px;border-radius:4px;background:#3a3d44}
.bar svg{width:24px;height:24px}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.feat div{border-top:4px solid var(--red);padding-top:16px;font-size:25px;font-weight:600;line-height:1.3}
.big{display:flex;flex-direction:column;align-items:center;text-align:center;gap:30px}
.big svg{width:230px;height:230px}
.big h1{font-size:96px;font-weight:700;letter-spacing:-2.5px;line-height:1}
.big p{font-size:36px;font-weight:600;line-height:1.25;max-width:820px}
.big p b{color:var(--red)}
.list{display:flex;flex-direction:column;gap:14px;font-size:27px;color:#D7DADF;align-items:center}
.cta{margin-top:6px;padding:18px 34px;border-radius:40px;background:var(--red);color:#fff;font-size:28px;font-weight:700}
</style>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mk" viewBox="0 0 256 256"><path fill="#E5484D" d="M68,173.86 L68,72 A60,60 0 0 1 185.83,56.03 Z"/><path fill="#E5484D" d="M188,82.14 L188,184 A60,60 0 0 1 70.17,199.97 Z"/></symbol>
<symbol id="sc" viewBox="0 0 936 500" preserveAspectRatio="none"><circle cx="660" cy="250" r="76" fill="#f0a36b" opacity=".55"/>
<path d="M0 330 L130 260 L250 310 L390 220 L520 300 L650 240 L780 300 L936 250 L936 500 L0 500Z" fill="#2c2340"/>
<path d="M0 380 L160 330 L320 370 L470 320 L620 380 L760 340 L936 375 L936 500 L0 500Z" fill="#1c1626"/></symbol>
</defs></svg>

<!-- 1: the problem -->
<section class="s" id="s1">
  <h2 data-t="h1"></h2>
  <div class="screen"><svg class="scene"><use href="#sc"/></svg>
    <div class="live"><i></i>LIVE</div>
    <div class="bub"><div><b>rina_</b> <span data-t="c1"></span></div><div><b>dimas</b> <span data-t="c2"></span></div><div><b>yoga77</b> <span data-t="c3"></span></div></div>
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
  <div class="brand"><svg><use href="#mk"/></svg>Sirah Mute<span class="r" data-t="next"></span></div>
</section>

<!-- 2: the fix -->
<section class="s" id="s2">
  <h2 data-t="h2"></h2>
  <div class="screen"><svg class="scene"><use href="#sc"/></svg>
    <div class="live"><i></i>LIVE</div>
    <div class="pill"><span class="ic">&#xEC54;</span><span class="lb">Mic mute</span><span class="ck">3:12</span></div>
    <div class="bar"><span class="dot"></span><span class="dot"></span><svg><use href="#mk"/></svg></div>
    <div class="glow"></div>
  </div>
  <div class="feat"><div data-t="f1"></div><div data-t="f2"></div><div data-t="f3"></div></div>
  <div class="brand"><svg><use href="#mk"/></svg>Sirah Mute<span class="r">kurohiko.id</span></div>
</section>

<!-- 3: call to action -->
<section class="s" id="s3">
  <div class="big">
    <svg><use href="#mk"/></svg>
    <h1>Sirah Mute</h1>
    <p data-t="tag"></p>
    <div class="list"><span data-t="l1"></span><span data-t="l2"></span></div>
    <div class="cta">github.com/Kurohiko-id/sirah-mute</div>
  </div>
  <div class="brand" style="justify-content:center"><span class="r" style="margin:0">kurohiko.id</span></div>
</section>

<script>
const T={
en:{h1:'Talked for 5 minutes.<br><b>Nobody heard a word.</b>',c1:"hello?? you're muted lol",c2:"we can't hear you",c3:'bro is MUTED',next:'There\'s a fix →',
 h2:'Sirah Mute makes mute <b>impossible to miss.</b>',f1:'Red glow around your screen',f2:'Popup that counts the mute time',f3:'A nudge when you talk while muted',
 tag:'Never talk into a <b>muted</b> mic again.',l1:'One key, works in any app or game',l2:'Free · Windows 10/11 · ~3.5 MB RAM'},
id:{h1:'Ngomong 5 menit.<br><b>Ternyata mute.</b>',c1:'halo?? lu mute wkwk',c2:'suaranya ga ada bang',c3:'MUTE WOI',next:'Ada solusinya →',
 h2:'Sirah Mute bikin mute <b>nggak mungkin kelewat.</b>',f1:'Cahaya merah di pinggir layar',f2:'Popup yang ngitung lama mute',f3:'Peringatan kalau ngomong pas mute',
 tag:'Jangan sampai ngomong ke mic yang lagi <b>mute</b> lagi.',l1:'Satu tombol, jalan di app atau game apa pun',l2:'Gratis · Windows 10/11 · RAM ~3,5 MB'}};
const [s,l]=(location.hash.slice(1)||'1-en').split('-');

document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=T[l][e.dataset.t]);
